# juxtopposed mpv settings. Merge into ~/.config/mpv/mpv.conf (Linux and macOS) or %APPDATA%\mpv\mpv.conf.

# stay open on the Home view when nothing is playing
idle=yes

# show the window (with the Home view) even when nothing is playing; without this mpv opens no window
force-window=yes

# Home lists: Continue Watching and Listen Again read the history file and the resume files
save-watch-history=yes
save-position-on-quit=yes
write-filename-in-watch-later-config=yes

# open at the size the design is drawn at (text is scaled to the window height)
geometry=1280x720
