# juxtopposed on-screen controller settings.
# Install as ~/.config/mpv/script-opts/osc.conf (Linux and macOS) or %APPDATA%\mpv\script-opts\osc.conf (Windows).
# Needs mpv built from this repository (the juxtopposed layout and icons are in player/lua/osc.lua).

layout=juxtopposed
icon_style=juxtopposed

# the bar is opaque (WCAG: translucent bars failed the contrast check)
boxalpha=0
background_color=#1B1B1B

# colours (VLC juxtopposed tokens, as in redesign/prototype.html: icons and times in #8F8F8F)
timecode_color=#8F8F8F
title_color=#8F8F8F
time_pos_color=#8F8F8F
buttons_color=#8F8F8F
small_buttonsL_color=#8F8F8F
small_buttonsR_color=#8F8F8F
top_buttons_color=#8F8F8F
held_element_color=#D9D9D9

# the bar stays for 10 seconds after the mouse stops (milliseconds)
hidetimeout=10000

# the window title bar already shows the file name, so the top strip does not repeat it
juxt_title=no

# no logo on the Home view (Home replaces the idle screen)
idlescreen=no

# icons only, no track numbers next to the audio and subtitle buttons
tracknumberswidth=0

# the three-dot menu and the Home button
menu_mbtn_left_command=script-message juxt-menu
# audio and subtitle buttons open the track pickers (as in the design), not just cycle
audio_track_mbtn_left_command=script-binding select/select-aid
sub_track_mbtn_left_command=script-binding select/select-sid
home_mbtn_left_command=stop
