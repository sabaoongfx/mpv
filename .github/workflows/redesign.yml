name: redesign

# Tests and checks for the juxtopposed redesign (redesign/). Runs when those files change.

on:
  push:
    paths:
      - 'redesign/**'
      - 'player/lua/**'
      - '.github/workflows/redesign.yml'
  pull_request:
    paths:
      - 'redesign/**'
      - 'player/lua/**'
      - '.github/workflows/redesign.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Lua syntax
        run: |
          luac5.4 -p player/lua/osc.lua redesign/bundle/scripts/*.lua redesign/tests/lua/*.lua

      - name: Lua tests
        run: cd redesign/tests/lua && lua5.4 run.lua

      - name: Python tests
        # the icon drift checks skip here: the VLC redesign tree is not part of this repository
        run: python3 -m unittest discover -s redesign/tests/python -v

      - name: Colour contrast
        run: python3 redesign/tools/contrast.py

  smoke:
    # Builds mpv from this repository (the same container as upstream's Linux job, which has a
    # libplacebo new enough for this mpv) and runs the bundle's headless smoke test.
    runs-on: ubuntu-latest
    container:
      image: "registry.opensuse.org/home/mia/images/images/mpv-ci:stable-deps"
    steps:
      - uses: actions/checkout@v7

      - name: Build mpv
        run: |
          meson setup build -Dtests=false
          meson compile -C build

      - name: Smoke test the bundle
        run: python3 redesign/tests/smoke/ipc_smoke.py build/mpv redesign/bundle

      - name: Install display and capture tools
        run: zypper --non-interactive install xorg-x11-server ffmpeg fontconfig dejavu-fonts

      - name: Start Xvfb (1280x720)
        run: |
          setsid Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3

      - name: Screenshot check
        run: python3 redesign/tests/smoke/screens.py build/mpv redesign/bundle screenshots

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: juxt-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload mpv log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: juxt-smoke-log
          path: /tmp/juxt-smoke-*/mpv.log
          if-no-files-found: ignore
